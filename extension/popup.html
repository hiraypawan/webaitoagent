<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Web Agents To</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      h3 { margin: 0 0 8px; font-size: 15px; }
      label { display: block; margin-top: 8px; font-weight: 600; }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 2px;
        padding: 4px 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font: inherit;
      }
      .row { display: flex; gap: 6px; margin-top: 10px; }
      button {
        flex: 1;
        padding: 6px 8px;
        border: none;
        border-radius: 4px;
        background: #4f46e5;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.secondary { background: #6b7280; }
      #status { margin-top: 10px; min-height: 16px; color: #374151; }
      #status.error { color: #b91c1c; }
      pre {
        max-height: 140px;
        overflow: auto;
        margin: 8px 0 0;
        padding: 6px;
        background: #f3f4f6;
        border-radius: 4px;
        font-size: 11px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h3>Web Agents To</h3>

    <label for="baseUrl">Local API URL</label>
    <input id="baseUrl" type="url" placeholder="http://127.0.0.1:8787" />

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" autocomplete="off" />

    <label for="model">Model</label>
    <input id="model" type="text" placeholder="mimo/mimo-v2.6-pro" />

    <div class="row">
      <button id="save">Save</button>
      <button id="test" class="secondary">Test</button>
    </div>
    <div class="row">
      <button id="models" class="secondary">List models</button>
    </div>

    <div id="status" role="status"></div>
    <pre id="out"></pre>

    <script src="popup.js"></script>
  </body>
</html>
