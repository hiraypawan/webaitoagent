<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; font-family: sans-serif; padding: 12px; }
    button { padding: 6px 10px; background: #4f46e5; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>Web Agents To</h3>
  <p>Local API: http://127.0.0.1:8787</p>
  <button id="models">List Models</button>
  <pre id="out" style="font-size:11px;max-height:200px;overflow:auto;"></pre>
  <script>
    document.getElementById("models").onclick = () => {
      chrome.runtime.sendMessage({ type: "models" }, (resp) => {
        document.getElementById("out").textContent = JSON.stringify(resp, null, 2);
      });
    };
  </script>
</body>
</html>
